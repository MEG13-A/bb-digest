name: Digest diario de Blackboard

on:
  schedule:
    # 11:00 UTC = 7:00 AM costa este en verano (EDT). En invierno cae a las 6:00 AM:
    # cambialo a "0 12 * * *" cuando entre el horario estandar en noviembre.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      ics_url:
        description: "URL del ICS a usar en esta corrida (dejalo vacio para usar el secret ICS_URL)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bb-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar que esten los secrets
        id: secrets
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          ICS_URL_INPUT: ${{ inputs.ics_url }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          faltan=""
          [ -n "$ICS_URL_INPUT" ] || [ -n "$ICS_URL" ] || faltan="$faltan ICS_URL"
          [ -n "$GMAIL_USER" ] || faltan="$faltan GMAIL_USER"
          [ -n "$GMAIL_APP_PASSWORD" ] || faltan="$faltan GMAIL_APP_PASSWORD"
          [ -n "$GMAIL_TO" ] || faltan="$faltan GMAIL_TO"
          if [ -n "$faltan" ]; then
            echo "configurados=false" >> "$GITHUB_OUTPUT"
            echo "::error::Faltan secrets:$faltan . Cargalos en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "configurados=true" >> "$GITHUB_OUTPUT"
          echo "Secrets OK."

      - name: Correr las pruebas
        run: python test_bb_digest.py

      - name: Mandar el digest por email
        if: steps.secrets.outputs.configurados == 'true'
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          ICS_URL_INPUT: ${{ inputs.ics_url }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          url="${ICS_URL_INPUT:-$ICS_URL}"
          python bb_digest.py --ics "$url" --days 7 > digest.txt
          cat digest.txt
          python - <<'EOF'
          import os, smtplib
          from email.message import EmailMessage
          with open("digest.txt", encoding="utf-8") as f:
              body = f.read()
          msg = EmailMessage()
          msg["Subject"] = "📚 Digest Blackboard"
          msg["From"] = os.environ["GMAIL_USER"]
          msg["To"] = os.environ["GMAIL_TO"]
          msg.set_content(body)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(msg)
          print("email enviado")
          EOF

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tocar .keepalive los lunes
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Hoy no es lunes, no hay nada que hacer."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet && { echo "Sin cambios."; exit 0; }
          git commit -m "chore: keepalive del cron"
          git push
